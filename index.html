<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DV Autonomy - Assistente de Visão</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { black: '#030712', dark: '#0A1128', card: '#0F172A', blue: '#0066FF', electric: '#0099FF', sky: '#38BDF8' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #030712; }
    .pulse-blue { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-brand-blue selection:text-white">

  <!-- Modal Chave API -->
  <div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-brand-dark border border-brand-blue/40 p-6 rounded-3xl w-full max-w-md shadow-2xl shadow-brand-blue/20">
      <h2 class="text-xl font-bold text-brand-electric mb-2">Configurar Chave API</h2>
      <p class="text-sm text-slate-300 mb-4">Insira a sua chave da API do Gemini para iniciar o assistente.</p>
      <input type="password" id="api-key-input" placeholder="Cole sua API Key (AIzaSy...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white mb-4 focus:outline-none focus:border-brand-electric">
      <button onclick="saveApiKey()" class="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-brand-blue/30">Salvar e Iniciar</button>
    </div>
  </div>

  <!-- Cabeçalho -->
  <header class="text-center py-2 border-b border-slate-800/80">
    <h1 class="text-2xl font-black text-brand-electric tracking-wide">DV AUTONOMY</h1>
    <p class="text-xs text-slate-400 font-medium">Assistente de Visão e Autonomia por Voz</p>
  </header>

  <!-- Área de toque principal -->
  <main id="touch-area" class="flex-1 flex flex-col justify-between my-4 gap-4 cursor-pointer">
    
    <div class="bg-brand-dark/80 border-2 border-brand-blue/50 rounded-2xl p-4 text-center shadow-lg shadow-brand-blue/10">
      <h2 class="text-lg font-bold text-brand-sky uppercase tracking-wider">Toque em qualquer lugar</h2>
      <p class="text-xs text-slate-300 mt-1">ou diga <span class="text-brand-electric font-semibold">"Tirar foto"</span> a qualquer momento</p>
    </div>

    <!-- Status / Resposta da IA -->
    <div id="status-card" class="bg-brand-card/90 border border-slate-800 rounded-2xl p-5 min-h-[140px] flex items-center justify-center text-center shadow-inner">
      <p id="status-text" class="text-base font-medium text-slate-200">A carregar assistente...</p>
    </div>

    <!-- Visualização da Câmara -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
      <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div id="loader" class="hidden absolute inset-0 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center gap-3">
        <div class="w-12 h-12 border-4 border-brand-blue border-t-brand-electric rounded-full animate-spin"></div>
        <p class="text-sm font-semibold text-brand-sky pulse-blue">A analisar imagem...</p>
      </div>
    </div>
  </main>

  <!-- Controlos Rodapé -->
  <footer class="grid grid-cols-2 gap-3 pt-2">
    <button onclick="switchCamera()" class="bg-slate-900 border border-slate-800 hover:border-brand-blue text-xs text-slate-300 py-3 rounded-xl font-semibold">Trocar Câmera</button>
    <button onclick="resetApiKey()" class="bg-slate-900 border border-slate-800 hover:border-rose-900/50 text-xs text-rose-400 py-3 rounded-xl font-semibold">Alterar Chave API</button>
  </footer>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('canvas');
    let statusText = document.getElementById('status-text');
    let loader = document.getElementById('loader');
    let currentStream = null;
    let facingMode = 'environment';
    let recognition = null;
    let isProcessing = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (apiKey) {
        document.getElementById('api-modal').classList.add('hidden');
        initApp();
      }
    });

    function saveApiKey() {
      const input = document.getElementById('api-key-input').value.trim();
      if (input) {
        apiKey = input;
        localStorage.setItem('gemini_api_key', apiKey);
        document.getElementById('api-modal').classList.add('hidden');
        initApp();
      }
    }

    function resetApiKey() {
      localStorage.removeItem('gemini_api_key');
      location.reload();
    }

    async function initApp() {
      await startCamera();
      playAudioSequence();
      setupSpeechRecognition();
      
      document.getElementById('touch-area').addEventListener('click', (e) => {
        if (!e.target.closest('button') && !isProcessing) {
          captureAndAnalyze();
        }
      });
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
        video.srcObject = currentStream;
      } catch (err) {
        statusText.innerText = "Erro ao acessar a câmera: " + err.message;
      }
    }

    function switchCamera() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    }

    function speak(text, onEndCallback) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;
      if (onEndCallback) utterance.onend = onEndCallback;
      window.speechSynthesis.speak(utterance);
    }

    function playAudioSequence() {
      const welcomeAudio = new Audio('boas-vindas.mp3');
      statusText.innerText = "A reproduzir mensagem de boas-vindas...";
      
      welcomeAudio.play().then(() => {
        welcomeAudio.onended = () => {
          const instruction = "Aponte a câmera para o objeto e toque na tela ou diga: Tirar foto.";
          statusText.innerText = instruction;
          speak(instruction);
        };
      }).catch(() => {
        const instruction = "Aponte a câmera para o objeto e toque na tela ou diga: Tirar foto.";
        statusText.innerText = instruction;
        speak(instruction);
      });
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'pt-BR';

      recognition.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1];
        const command = lastResult[0].transcript.trim().toLowerCase();
        
        if (command.includes("tirar foto") || command.includes("foto") || command.includes("analisar")) {
          if (!isProcessing) captureAndAnalyze();
        }
      };

      recognition.onend = () => {
        try { recognition.start(); } catch(e) {}
      };

      try { recognition.start(); } catch(e) {}
    }

    async function captureAndAnalyze() {
      isProcessing = true;
      loader.classList.remove('hidden');
      statusText.innerText = "Foto capturada! A analisar com o Gemini...";
      speak("Foto capturada. Aguarde um instante.");

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
      await analyzeImage(base64Image);
    }

    async function analyzeImage(base64Image) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{
          parts: [
            { text: "Você é o assistente de visão DV Autonomy. Descreva em português do Brasil o que está nesta imagem de forma objetiva, direta e acessível para uma pessoa com deficiência visual. Mencione o objeto principal, sua cor e posição." },
            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
          ]
        }]
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const description = data.candidates[0].content.parts[0].text;
        statusText.innerText = description;
        speak(description);

      } catch (err) {
        const errMsg = "Não foi possível analisar: " + err.message;
        statusText.innerText = errMsg;
        speak("Desculpe, ocorreu um erro ao analisar a imagem.");
      } finally {
        loader.classList.add('hidden');
        isProcessing = false;
      }
    }
  </script>
</body>
</html>
